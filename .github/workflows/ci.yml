name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install console dependencies
        run: npm --prefix apps/console ci --ignore-scripts --no-audit --no-fund
      - name: Test, lint and build
        run: npm test
